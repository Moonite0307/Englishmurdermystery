# 使用持久化磁盘，防止服务重新部署后丢失账号。
# starter 和磁盘属于 Render 付费资源；在平台确认费用后才创建。
services:
  - type: web
    name: englishmurdermystery-accounts
    runtime: node
    plan: starter
    region: singapore
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ACCOUNT_DATA_DIR
        value: /var/data/accounts
    disk:
      name: account-storage
      mountPath: /var/data
      sizeGB: 1
